version: '3.8'

services:
  gateway-api:
    image: ${DOCKER_REGISTRY-}gateway-api
    build:
      context: .
      dockerfile: gateway-api/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - order-service
      - payment-service

  order-service:
    image: ${DOCKER_REGISTRY-}order-service
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "5001:8080"
    depends_on:
      - sql-server
    environment:
      - ConnectionStrings__DefaultConnection=Server=sql-server;Database=OrderDb;User Id=sa;Password=YourStrong!Password;TrustServerCertificate=True;

  payment-service:
    image: ${DOCKER_REGISTRY-}payment-service
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - PayPal__ClientId=YOUR_PAYPAL_CLIENT_ID
      - PayPal__ClientSecret=YOUR_PAYPAL_CLIENT_SECRET
      - PayPal__Mode=Sandbox

  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Password
    ports:
      - "1433:1433"
