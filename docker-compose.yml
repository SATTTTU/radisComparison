version: '3.8'

services:
  gateway-api:
    image: ${DOCKER_REGISTRY-}gateway-api
    build:
      context: .
      dockerfile: gateway-api/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - order-service
      - payment-service

  order-service:
    image: ${DOCKER_REGISTRY-}order-service
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "5001:8080"
    depends_on:
      - postgres
    environment:
      - ORDER_DB_CONNECTION=Host=postgres;Port=5432;Username=postgres;Password=admin;Database=myname

  payment-service:
    image: ${DOCKER_REGISTRY-}payment-service
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - PayPal__ClientId=AUGLpfrI36CJFUTgPMuxMy3m0Fnujfx9r-1bdkN0UnrE40lFc1_Hc8JewXHeTnxFeo45skCkHmeuNpJx
      - PayPal__ClientSecret=ED_O_L5hHNnTjZwBn_sbEQDZ8G7EBXuUzF6mYZU1wyO8nYfMvwtYbmgmo1HTH-E8qn1wtxOa6yGpX78h
      - PayPal__Mode=Sandbox

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=myname
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
